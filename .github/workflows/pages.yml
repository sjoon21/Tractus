# 소개 사이트(site/) → GitHub Pages (https://sjoon21.github.io/Tractus/). 스크린샷은 scripts/site.sh가 docs/images에서 모은다
name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/images/**", "docs/releases/**", "scripts/site.sh", "scripts/releases_page.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7 # 릴리스 노트 페이지(markdown-it-py)
      - run: scripts/site.sh _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
