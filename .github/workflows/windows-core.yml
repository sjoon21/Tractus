# Windows 코어 (docs/windows/README.md W2): 코어(src/tractus)가 Windows에서 불러와지고 모델 없는 단위 테스트가 모두 통과하는지 본다.
# 앱·녹음 프로그램·모델(slow)은 보지 않는다. W2(v3.139)부터 전체 테스트가 실패하면 빨간색이다(필수 검사가 아니라 macOS 합치기·릴리스는 막지 않는다).
name: Windows core

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1" # 매주 월요일 03:00 UTC
  pull_request:
    paths:
      - "src/tractus/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/windows-core.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: 코어 (Windows pytest)
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@v7
      - name: 시간대 Asia/Seoul (conftest의 TZ는 Windows에서 먹지 않는다)
        shell: pwsh # Git Bash는 /s를 경로로 바꾼다
        run: tzutil /s "Korea Standard Time"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - name: ffmpeg (시험이 가짜 음성을 만들고 코어가 디코딩한다)
        run: |
          choco install ffmpeg --version 9.0.2 -y --no-progress  # 고정: 커뮤니티 패키지의 새 빌드가 말없이 바뀌지 않게
          ffmpeg -version | head -n 1
      - run: uv sync --locked
      - name: 불러오기 (CLI·MCP)
        run: uv run python -c "import tractus.cli, tractus.mcp_server"
      - name: 고른 테스트 (반드시 통과)
        run: uv run pytest -q tests/test_platform_compat.py
      - name: 전체 테스트 (실패하면 빨간색, 실패 목록은 요약에)
        run: |
          set -o pipefail
          uv run pytest -q -rfE --tb=line -p no:cacheprovider 2>&1 | tee pytest.txt
      - name: 실패 목록
        if: always()
        run: |
          {
            echo "## Windows 전체 테스트"
            echo
            tail -n 1 pytest.txt 2>/dev/null || echo "(결과 없음)"
            echo
            echo '```'
            grep -E '^(FAILED|ERROR) ' pytest.txt 2>/dev/null || echo "실패 없음"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
