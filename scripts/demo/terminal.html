<!doctype html><meta charset="utf-8"><title>claude</title>
<style>
  :root { --bg:#f5f5f4; --win:#1c1c1e; --fg:#e6e6e6; --dim:#8e8e93; --acc:#d9a35b; --cite:#7cc4e8; --ok:#9fd39a; }
  * { box-sizing:border-box } html,body { margin:0; height:100%; background:var(--bg) }
  body { display:grid; place-items:center; font:15.5px/1.65 "SF Mono", Menlo, "Apple SD Gothic Neo", monospace }
  .win { width:1080px; height:640px; background:var(--win); border-radius:12px; box-shadow:0 30px 70px rgba(0,0,0,.28), 0 0 0 1px rgba(0,0,0,.2); overflow:hidden; color:var(--fg) }
  .bar { height:38px; display:flex; align-items:center; gap:8px; padding:0 14px; background:#2a2a2c; color:var(--dim); font:13px -apple-system, sans-serif }
  .dot { width:12px; height:12px; border-radius:50% } .t { margin:auto; transform:translateX(-30px) }
  pre { margin:0; padding:22px 26px; white-space:pre-wrap; word-break:keep-all; font:inherit }
  .p { color:var(--acc) } .d { color:var(--dim) } .c { color:var(--cite) } .ok { color:var(--ok) } .b { font-weight:700 }
  .cur { display:inline-block; width:9px; height:1.15em; background:var(--fg); vertical-align:-3px; animation:blink 1s steps(1) infinite }
  @keyframes blink { 50% { opacity:0 } }
  #cap { position:fixed; left:50%; bottom:28px; transform:translateX(-50%); padding:10px 18px; border-radius:999px; background:rgba(17,17,17,.88); color:#fff; font:600 16px/1.3 -apple-system,'Apple SD Gothic Neo',sans-serif; white-space:nowrap }
</style>
<div class="win"><div class="bar"><span class="dot" style="background:#ff5f57"></span><span class="dot" style="background:#febc2e"></span><span class="dot" style="background:#28c840"></span><span class="t">claude — ~/work</span></div><pre id="out"></pre></div>
<div id="cap">Claude Code에서 내 회의를 물어봅니다 · tractus 플러그인</div>
<script>
const out = document.getElementById("out");
const KO = {};
KO.Q = "3분기 예산 회의에서 GPU 서버 구매는 어떻게 하기로 했어?";
KO.ANSWER = [
  ['<span class="b">3분기 GPU 서버 구매는 보류하고, 클라우드 GPU를 월 800만 원 한도로 쓰기로 했습니다.</span>', ""],
  ["", ""],
  ["  • H100 두 장 서버 견적은 대당 9,800만 원이었습니다. ", '<span class="c">(3분기 예산 계획 회의, 00:01:16)</span>'],
  ["  • 실험이 매일 있지 않아 구매는 이르다는 의견이 나왔습니다. ", '<span class="c">(3분기 예산 계획 회의, 00:01:33)</span>'],
  ["  • 구매 보류와 월 800만 원 예산으로 정리했습니다. ", '<span class="c">(3분기 예산 계획 회의, 00:01:56)</span>'],
  ["", ""],
  ["  이후 9월 회의에서 올해는 사지 않고 내년 1분기에 다시 검토하기로 바뀌었습니다.", ""],
  ["  ", '<span class="c">(4분기 예산 및 OKR 회의, 00:02:08)</span>'],
];
KO.HEAD = "╭ tractus 플러그인 · 내 Mac의 노트를 검색합니다";
KO.QUERY = "GPU 서버 구매";
KO.FOUND = "노트 2개에서 근거를 찾았습니다";
const EN = {
  cap: "Ask Claude Code about your notes · tractus plugin",
  HEAD: "╭ tractus plugin · searches the notes on this Mac",
  Q: "In the Q3 budget meeting, what did we decide about buying a GPU server?",
  QUERY: "GPU server purchase",
  FOUND: "Found evidence in 2 notes",
  ANSWER: [
    ['<span class="b">The Q3 GPU server purchase is on hold; cloud GPUs are capped at $8K a month instead.</span>', ""],
    ["", ""],
    ["  • The quote for a server with two H100s was $98K each. ", '<span class="c">[Q3 budget planning 00:01:16]</span>'],
    ["  • Buying felt early, since experiments don't run every day. ", '<span class="c">[Q3 budget planning 00:01:33]</span>'],
    ["  • The team settled on holding the purchase with an $8K monthly budget. ", '<span class="c">[Q3 budget planning 00:01:56]</span>'],
    ["", ""],
    ["  In the September meeting this changed: no purchase this year, revisit in Q1 next year.", ""],
    ["  ", '<span class="c">[Q4 budget and OKRs 00:02:08]</span>'],
  ],
};
const isEn = location.search.includes("lang=en");
const { Q, ANSWER, HEAD, QUERY, FOUND } = isEn ? EN : KO;
if (isEn) { document.getElementById("cap").textContent = EN.cap; document.documentElement.lang = "en"; }
// 답을 찍는 단위: 한국어는 글자마다, 영어는 낱말마다(글자 수가 많아 프레임·GIF가 두 배로 커진다)
const [STEP_RE, STEP_MS] = isEn ? [/<[^>]+>|[^<\s]+\s*|\s+/gu, 40] : [/<[^>]+>|./gsu, 14];
let html = "";
const render = (cursor = true) => (out.innerHTML = html + (cursor ? '<span class="cur"></span>' : ""));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
window.play = async () => {
  html = `<span class="d">${HEAD}</span>\n\n<span class="p">&gt;</span> `;
  render(); await sleep(700);
  for (const ch of Q) { html += ch; render(); await sleep(isEn ? 35 : 55); } // 영어 질문은 길어서 빠르게
  await sleep(500); html += "\n\n"; render(); await sleep(300);
  html += `<span class="ok">⏺</span> <span class="b">tractus</span> · search_meetings <span class="d">(query: "${QUERY}")</span>\n`; render(); await sleep(900);
  html += `  <span class="d">⎿  ${FOUND}</span>\n\n`; render(); await sleep(700);
  html += '<span class="ok">⏺</span> ';
  for (const [text, cite] of ANSWER) {
    for (const ch of text.match(STEP_RE) || []) { html += ch; if (!ch.startsWith("<")) { render(); await sleep(STEP_MS); } }
    if (cite) { await sleep(120); html += cite; render(); }
    html += "\n"; render(); await sleep(260);
  }
  render(true);
  window.done = true;
};
</script>
