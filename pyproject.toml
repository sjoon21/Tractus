[project]
name = "tractus"
version = "0.1.0"
description = "Local-first 회의 전사·회의록 도구"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "kaldi-native-fbank==1.22.3",
    "mcp>=2.2,<2.3",
    "mlx-audio>=0.5.7",
    "mlx-lm>=0.32.0",
    "onnxruntime==1.30.0",
    "openai>=3.23.0",
    "python-docx>=1.2",
    "sqlite-vec==0.1.9",
    "typer>=0.12",
]

[project.scripts]
tractus = "tractus.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: 실제 모델을 돌리는 테스트 (`pytest -m slow`)",
    "llm: 실제 LLM API를 호출하는 테스트 (`pytest -m llm`, 키가 있는 공급자만)",
]
addopts = "-m 'not slow and not llm'"
