[package]
name = "tractus-app"
version = "0.1.0"
description = "Tractus 데스크톱 앱"
license = "Apache-2.0"
edition = "2021"

[lib]
name = "tractus_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon: 메뉴 막대 아이콘(MIT/Apache-2.0, 이미 Cargo.lock에 있던 tray-icon 0.25), image-png: 아이콘 PNG를 Image::from_bytes로 읽는다
tauri = { version = "2", features = ["tray-icon", "image-png"] }
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = "1"
# 휴지통으로 옮기기 (MIT). macOS는 NSFileManager를 쓴다: Finder 자동화 권한이 필요 없다
trash = { version = "5", default-features = false }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
